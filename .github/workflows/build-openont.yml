name: Build OpenONT

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "LICENSES/**"

permissions:
  contents: read

concurrency:
  group: openont-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64
          - name: armsr_armv8
            target: armsr_armv8
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev python3 python3-dev python3-pyelftools \
            qemu-utils time zlib1g-dev

      - name: Cache download directory
        uses: actions/cache@v4
        with:
          path: dl
          key: openont-dl-${{ matrix.name }}-${{ hashFiles('feeds.conf.default', 'include/download.mk') }}
          restore-keys: |
            openont-dl-${{ matrix.name }}-
            openont-dl-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply OpenONT config
        run: |
          chmod +x scripts/openont/apply-config.sh
          ./scripts/openont/apply-config.sh "${{ matrix.target }}"

      - name: Build
        run: |
          make -j"$(nproc)" world V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/targets -type f \( \
            -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' -o \
            -name '*.vdi' -o -name '*.vhdx' -o -name '*.tar.gz' -o \
            -name 'sha256sums' -o -name '*.bin' -o -name '*.rootfs*' \
          \) -print0 | xargs -0 -I{} cp -a {} out/ 2>/dev/null || true
          ls -lah out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openont-${{ matrix.name }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
