name: Build Smoke

# Title shown in Actions (e.g. commit message). Build Images copies this when chained.
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Build Smoke' }}

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: multiple Smoke runs may execute in parallel.

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files
        run: |
          set -euo pipefail
          files=(
            package/openont/openont-core/Makefile
            package/openont/openont-core/files/usr/lib/openont/port.sh
            package/openont/openont-core/files/usr/lib/openont/address.sh
            package/openont/openont-core/files/usr/lib/openont/nat.sh
            package/openont/openont-core/files/usr/lib/openont/ipgroup.sh
            package/openont/openont-core/files/usr/lib/openont/offload.sh
            package/openont/openont-core/files/usr/lib/openont/pppoe.sh
            package/openont/openont-core/files/usr/sbin/openont-port
            package/openont/openont-core/files/usr/sbin/openont-address
            package/openont/openont-core/files/usr/sbin/openont-nat
            package/openont/openont-core/files/usr/sbin/openont-ipgroup
            package/openont/openont-core/files/usr/sbin/openont-offload
            package/openont/openont-core/files/usr/sbin/openont-pppoe
            package/openont/luci-mod-openont/Makefile
            package/openont/luci-mod-openont/root/usr/libexec/rpcd/openont
            package/openont/luci-mod-openont/root/etc/init.d/openont-stats
            package/openont/luci-mod-openont/root/usr/sbin/openont-statsd
            package/openont/luci-mod-openont/root/usr/share/rpcd/acl.d/luci-mod-openont.json
            package/openont/luci-mod-openont/root/usr/share/luci/menu.d/zzz-luci-mod-openont.json
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/overview.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/ports.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/portmap.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/dmz.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/ipgroup.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/offload.js
            package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/pppoe.js
            package/openont/luci-mod-openont/po/zh_Hans/openont.po
            package/openont/luci-mod-openont/po/templates/openont.pot
            package/openont/luci-theme-openont/htdocs/luci-static/openont/cascade.css
            package/openont/luci-theme-openont/htdocs/luci-static/openont/theme-blue-sidebar.css
            package/openont/luci-theme-openont/htdocs/luci-static/openont/script.js
            package/openont/luci-theme-openont/htdocs/luci-static/resources/menu-openont.js
            configs/openont.common.config
            configs/openont-x86_64.config
            configs/openont-armsr_armv8.config
            scripts/openont/apply-config.sh
          )
          for f in "${files[@]}"; do
            test -f "$f" || { echo "missing: $f" >&2; exit 1; }
          done
          test ! -d samples || { echo "samples/ must not exist" >&2; exit 1; }
          # Stock overview source must not live in-tree (installed by Makefile overwrite only)
          test ! -f package/openont/luci-mod-openont/htdocs/luci-static/resources/view/status/overview.js \
            || { echo "status/overview.js must not be a source file; use openont/overview.js only" >&2; exit 1; }
          test ! -f package/openont/luci-mod-openont/root/usr/share/luci/menu.d/luci-mod-openont.json \
            || { echo "use zzz-luci-mod-openont.json so menu wins over luci-mod-status" >&2; exit 1; }
          if grep -q 'admin/openont' package/openont/luci-mod-openont/root/usr/share/luci/menu.d/zzz-luci-mod-openont.json; then
            echo "menu must not define admin/openont" >&2
            exit 1
          fi
          grep -q '"path": "openont/overview"' package/openont/luci-mod-openont/root/usr/share/luci/menu.d/zzz-luci-mod-openont.json \
            || { echo "menu must use openont/overview view path" >&2; exit 1; }
          if grep -n "admin/openont\|System Overview" \
            package/openont/luci-theme-openont/ucode/template/themes/openont/header.ut; then
            echo "theme still references System Overview / admin/openont" >&2
            exit 1
          fi
          # Makefile must overwrite stock status/overview with OpenONT dashboard
          grep -q 'view/status/overview.js' package/openont/luci-mod-openont/Makefile \
            || { echo "Makefile must install/overwrite status/overview.js" >&2; exit 1; }
          echo "files ok"

      - name: Executable bits (git index + working tree)
        run: |
          set -euo pipefail
          # Must be 100755 in git — luci.mk installs root/ with cp -pR.
          exec_files=(
            package/openont/luci-mod-openont/root/usr/libexec/rpcd/openont
            package/openont/luci-mod-openont/root/etc/init.d/openont-stats
            package/openont/luci-mod-openont/root/usr/sbin/openont-statsd
            package/openont/openont-core/files/usr/sbin/openont-port
            package/openont/openont-core/files/usr/sbin/openont-address
            package/openont/openont-core/files/usr/sbin/openont-nat
            package/openont/openont-core/files/usr/sbin/openont-ipgroup
            package/openont/openont-core/files/usr/sbin/openont-offload
            package/openont/openont-core/files/usr/sbin/openont-pppoe
            package/openont/openont-base/files/etc/uci-defaults/99-openont-defaults
            package/openont/openont-base/files/etc/profile.d/openont.sh
            package/openont/luci-theme-openont/root/etc/uci-defaults/30_luci-theme-openont
            scripts/openont/apply-config.sh
          )
          fail=0
          for f in "${exec_files[@]}"; do
            mode=$(git ls-files -s -- "$f" | awk '{print $1}')
            if [ "$mode" != "100755" ]; then
              echo "git mode not 100755 ($mode): $f" >&2
              fail=1
            fi
            if [ ! -x "$f" ]; then
              echo "working tree not executable: $f" >&2
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "executable bits ok"

      - name: Config selects OpenONT packages
        run: |
          set -euo pipefail
          for pkg in openont-core openont-base luci-mod-openont luci-theme-openont; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" configs/openont.common.config \
              || { echo "missing CONFIG_PACKAGE_${pkg}=y in openont.common.config" >&2; exit 1; }
          done
          # Must not enable stock themes or luci meta that pulls stock theme
          if grep -E '^CONFIG_PACKAGE_luci-theme-bootstrap=y' configs/openont.common.config; then
            echo "bootstrap theme must not be enabled" >&2
            exit 1
          fi
          grep -q 'CONFIG_PACKAGE_luci-theme-bootstrap is not set' configs/openont.common.config \
            || { echo "common config should disable luci-theme-bootstrap" >&2; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci is not set' configs/openont.common.config \
            || { echo "common config should not select luci meta package" >&2; exit 1; }
          grep -q 'CONFIG_PACKAGE_luci-light is not set' configs/openont.common.config \
            || { echo "common config should not select luci-light meta package" >&2; exit 1; }
          echo "config selection ok"

      - name: Theme and overview sources
        run: |
          set -euo pipefail
          test -f package/openont/luci-theme-openont/htdocs/luci-static/openont/cascade.css
          test -f package/openont/luci-theme-openont/htdocs/luci-static/openont/theme-blue-sidebar.css
          test -f package/openont/luci-theme-openont/htdocs/luci-static/resources/menu-openont.js
          test -f package/openont/luci-theme-openont/ucode/template/themes/openont/header.ut
          test -f package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/overview.js
          grep -q 'o-overview' package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/overview.js \
            || { echo "overview.js missing o-overview dashboard marker" >&2; exit 1; }
          grep -q "object: 'openont'" package/openont/luci-mod-openont/htdocs/luci-static/resources/view/openont/overview.js \
            || { echo "overview.js must use openont RPC" >&2; exit 1; }
          grep -q 'mediaurlbase=/luci-static/openont' \
            package/openont/openont-base/files/etc/uci-defaults/99-openont-defaults \
            package/openont/luci-theme-openont/root/etc/uci-defaults/30_luci-theme-openont \
            || { echo "uci-defaults must force openont mediaurlbase" >&2; exit 1; }
          grep -q "menu-openont" package/openont/luci-theme-openont/ucode/template/themes/openont/footer.ut \
            || { echo "footer must load menu-openont" >&2; exit 1; }
          # No CLI leak strings in LuCI views
          if grep -R -n -E 'CLI:|openont-port set |Same operations as openont-port' \
            package/openont/luci-mod-openont/htdocs 2>/dev/null; then
            echo "CLI / console leak strings found in UI sources" >&2
            exit 1
          fi
          echo "theme and overview sources ok"

      - name: i18n Check
        run: |
          set -euo pipefail
          if grep -R -n -P '[\x{4e00}-\x{9fff}]' \
            package/openont/luci-mod-openont/htdocs \
            package/openont/luci-mod-openont/root/usr/share/luci \
            package/openont/luci-theme-openont/ucode \
            package/openont/luci-theme-openont/htdocs 2>/dev/null; then
            echo "CJK found in UI sources; use gettext msgids" >&2
            exit 1
          fi
          echo "i18n ok"

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in \
            package/openont/openont-core/files/usr/lib/openont/*.sh \
            package/openont/openont-core/files/usr/sbin/openont-* \
            package/openont/luci-mod-openont/root/usr/libexec/rpcd/openont \
            package/openont/luci-mod-openont/root/usr/sbin/openont-statsd \
            package/openont/luci-mod-openont/root/etc/init.d/openont-stats \
            package/openont/openont-base/files/etc/uci-defaults/* \
            package/openont/luci-theme-openont/root/etc/uci-defaults/* \
            scripts/openont/apply-config.sh
          do
            sh -n "$f"
          done
          echo "syntax ok"
