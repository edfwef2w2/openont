name: Build Images

# When triggered by Build Smoke, reuse Smoke's run title (e.g. "ci: simplify job names").
run-name: ${{ github.event.workflow_run.display_title || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        required: true
        default: all
        type: choice
        options:
          - x86_64
          - armsr_armv8
          - all
  push:
    tags:
      - "v*"
  # After Build Smoke succeeds on main/master, build all images.
  workflow_run:
    workflows:
      - Build Smoke
    types:
      - completed

permissions:
  contents: read

# No concurrency group: multiple Images runs (and matrix targets) may run in parallel.

jobs:
  prepare:
    runs-on: ubuntu-latest
    # Skip failed/cancelled smoke; only auto-build for main/master.
    if: |
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'
        )
      )
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      ref: ${{ steps.set.outputs.ref }}
    steps:
      - id: set
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            t="${{ github.event.inputs.target }}"
            ref="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            t="all"
            ref="${{ github.event.workflow_run.head_sha }}"
          else
            t="all"
            ref="${{ github.sha }}"
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          case "$t" in
            x86_64)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"}]}' >> "$GITHUB_OUTPUT"
              ;;
            armsr_armv8)
              echo 'matrix={"include":[{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"},{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev python3 python3-dev python3-pyelftools \
            qemu-utils time

      - name: Cache dl/
        uses: actions/cache@v4
        with:
          path: dl
          key: openont-dl-${{ matrix.name }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openont-dl-${{ matrix.name }}-
            openont-dl-

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          chmod +x scripts/openont/apply-config.sh
          ./scripts/openont/apply-config.sh "${{ matrix.target }}"

      - name: Verify config kept OpenONT packages
        run: |
          set -euo pipefail
          # defconfig may drop unknown packages; fail early if selection vanished.
          for pkg in openont-core openont-base luci-mod-openont luci-theme-openont; do
            grep -E "^CONFIG_PACKAGE_${pkg}=y" .config \
              || { echo "after defconfig missing CONFIG_PACKAGE_${pkg}=y" >&2; exit 1; }
          done
          if grep -E '^CONFIG_PACKAGE_luci-theme-bootstrap=y' .config; then
            echo "after defconfig bootstrap theme still enabled" >&2
            exit 1
          fi
          echo "post-defconfig package selection ok"

      - name: Build
        run: make -j"$(nproc)" world V=s

      - name: Verify OpenONT packaged into rootfs
        run: |
          set -euo pipefail

          check_exec() {
            local f="$1"
            [ -f "$f" ] || { echo "missing: $f" >&2; return 1; }
            [ -x "$f" ] || { echo "not executable: $f" >&2; return 1; }
            echo "ok $f"
          }

          verify_tree() {
            local root="$1"
            echo "checking rootfs: $root"
            check_exec "$root/usr/libexec/rpcd/openont"
            check_exec "$root/etc/init.d/openont-stats"
            check_exec "$root/usr/sbin/openont-statsd"
            check_exec "$root/usr/sbin/openont-port"
            [ -f "$root/usr/share/rpcd/acl.d/luci-mod-openont.json" ] \
              || { echo "missing ACL under $root" >&2; return 1; }
            [ -f "$root/www/luci-static/resources/view/openont/ports.js" ] \
              || { echo "missing ports.js under $root" >&2; return 1; }
            [ -f "$root/www/luci-static/openont/cascade.css" ] \
              || { echo "missing openont theme CSS under $root" >&2; return 1; }
            [ -f "$root/usr/share/ucode/luci/template/themes/openont/header.ut" ] \
              || { echo "missing openont theme header under $root" >&2; return 1; }
            local ov="$root/www/luci-static/resources/view/status/overview.js"
            [ -f "$ov" ] || { echo "missing status/overview.js under $root" >&2; return 1; }
            grep -q 'o-overview' "$ov" \
              || { echo "status/overview.js is not OpenONT dashboard under $root" >&2; return 1; }
            # Stock bootstrap theme package should not be present
            if [ -d "$root/www/luci-static/bootstrap" ]; then
              echo "stock bootstrap theme static still in rootfs" >&2
              return 1
            fi
          }

          found_root=""
          # OpenWrt TARGET_DIR is usually build_dir/target-*/root-*
          while IFS= read -r d; do
            if [ -f "$d/usr/libexec/rpcd/openont" ]; then
              found_root="$d"
              break
            fi
          done < <(find build_dir -type d -path '*/root-*' 2>/dev/null | sort)

          if [ -z "$found_root" ]; then
            while IFS= read -r d; do
              if [ -f "$d/usr/libexec/rpcd/openont" ]; then
                found_root="$d"
                break
              fi
            done < <(find staging_dir bin/targets -type d \( -name 'root-*' -o -name 'rootfs' \) 2>/dev/null | sort)
          fi

          if [ -n "$found_root" ]; then
            verify_tree "$found_root"
          else
            # Fallback: inspect luci-mod-openont package (legacy .ipk only;
            # current OpenWrt defaults to .apk — prefer rootfs path above).
            ipk=$(find bin/packages bin/targets -type f -name 'luci-mod-openont*.ipk' 2>/dev/null | head -n1 || true)
            [ -n "$ipk" ] || { echo "no rootfs with openont and no luci-mod-openont .ipk fallback" >&2; exit 1; }
            echo "checking ipk: $ipk"
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            tar -xzf "$ipk" -C "$tmp"
            data=$(find "$tmp" -maxdepth 1 -name 'data.tar*' | head -n1)
            [ -n "$data" ] || { echo "ipk has no data.tar*" >&2; exit 1; }
            mkdir -p "$tmp/data"
            case "$data" in
              *.gz) tar -xzf "$data" -C "$tmp/data" ;;
              *.xz) tar -xJf "$data" -C "$tmp/data" ;;
              *.zst) tar --zstd -xf "$data" -C "$tmp/data" ;;
              *) tar -xf "$data" -C "$tmp/data" ;;
            esac
            verify_tree "$tmp/data"
          fi

          # OpenWrt mainline packages as .apk (CONFIG_USE_APK); older trees use .ipk.
          for name in openont-core luci-mod-openont luci-theme-openont; do
            if ! find bin/packages bin/targets -type f \( \
                -name "${name}*.ipk" -o -name "${name}*.apk" \
              \) 2>/dev/null | grep -q .; then
              echo "missing package artifact for $name (.ipk or .apk under bin/packages|bin/targets)" >&2
              exit 1
            fi
            echo "package ok: $name"
          done
          echo "OpenONT packaging verification ok"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find bin/targets -type f \( \
            -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' -o \
            -name '*.vdi' -o -name '*.vhdx' -o -name '*.tar.gz' -o \
            -name 'sha256sums' -o -name '*.bin' -o -name '*.rootfs*' \
          \) -exec cp -a {} out/ \; 2>/dev/null || true
          ls -lah out || true
          n=$(find out -maxdepth 1 -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "collected $n file(s)"

      # One Actions artifact per image/product (not one zip per arch).
      - name: Upload each product separately
        env:
          TARGET_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts to upload" >&2
            exit 0
          fi

          tool="$RUNNER_TEMP/gha-artifact-upload"
          mkdir -p "$tool"
          npm install --prefix "$tool" @actions/artifact@2 --silent
          export NODE_PATH="$tool/node_modules"
          export TARGET_NAME GITHUB_WORKSPACE

          node <<'NODE'
          const { DefaultArtifactClient } = require('@actions/artifact');
          const fs = require('fs');
          const path = require('path');

          const outDir = path.join(process.env.GITHUB_WORKSPACE, 'out');
          const target = process.env.TARGET_NAME || 'unknown';
          const client = new DefaultArtifactClient();

          function artifactName(fileName) {
            // Unique across matrix jobs; keep readable product basename.
            let name = `openont-${target}-${fileName}`;
            name = name.replace(/[^a-zA-Z0-9._-]+/g, '-');
            if (name.length > 200) name = name.slice(0, 200);
            return name;
          }

          (async () => {
            const names = fs.readdirSync(outDir).filter((n) => {
              try {
                return fs.statSync(path.join(outDir, n)).isFile();
              } catch {
                return false;
              }
            });
            if (names.length === 0) {
              console.log('No files in out/');
              return;
            }
            for (const fileName of names) {
              const full = path.join(outDir, fileName);
              const name = artifactName(fileName);
              console.log(`upload: ${name} <- ${fileName}`);
              // compressionLevel 9 = max zlib; retentionDays 400 = GitHub Actions max
              await client.uploadArtifact(name, [full], outDir, {
                retentionDays: 400,
                compressionLevel: 9,
              });
            }
            console.log(`uploaded ${names.length} artifact(s) for ${target}`);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
