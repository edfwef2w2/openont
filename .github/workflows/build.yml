name: Build Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - armsr_armv8
          - all
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: openont-build-${{ github.ref }}-${{ github.event.inputs.target || 'tag' }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            t="${{ github.event.inputs.target }}"
          else
            t="all"
          fi
          case "$t" in
            x86_64)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"}]}' >> "$GITHUB_OUTPUT"
              ;;
            armsr_armv8)
              echo 'matrix={"include":[{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"},{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev python3 python3-dev python3-pyelftools \
            qemu-utils time

      - name: Cache dl/
        uses: actions/cache@v4
        with:
          path: dl
          key: openont-dl-${{ matrix.name }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openont-dl-${{ matrix.name }}-
            openont-dl-

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          chmod +x scripts/openont/apply-config.sh
          ./scripts/openont/apply-config.sh "${{ matrix.target }}"

      - name: Build
        run: make -j"$(nproc)" world V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin/targets -type f \( \
            -name '*.img.gz' -o -name '*.img' -o -name '*.vmdk' -o \
            -name '*.vdi' -o -name '*.vhdx' -o -name '*.tar.gz' -o \
            -name 'sha256sums' -o -name '*.bin' -o -name '*.rootfs*' \
          \) -exec cp -a {} out/ \; 2>/dev/null || true
          ls -lah out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openont-${{ matrix.name }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
