name: Build Theme

run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Build Theme' }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to package theme for
        required: true
        default: all
        type: choice
        options:
          - x86_64
          - armsr_armv8
          - all
  push:
    paths:
      - "package/openont/luci-theme-openont/**"
      - ".github/workflows/build-theme.yml"
  pull_request:
    paths:
      - "package/openont/luci-theme-openont/**"
      - ".github/workflows/build-theme.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            t="${{ github.event.inputs.target }}"
          else
            t="all"
          fi
          case "$t" in
            x86_64)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"}]}' >> "$GITHUB_OUTPUT"
              ;;
            armsr_armv8)
              echo 'matrix={"include":[{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'matrix={"include":[{"name":"x86_64","target":"x86_64"},{"name":"armsr_armv8","target":"armsr_armv8"}]}' >> "$GITHUB_OUTPUT"
              ;;
          esac

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Theme source checks
        run: |
          set -euo pipefail
          theme=package/openont/luci-theme-openont
          for f in \
            "$theme/Makefile" \
            "$theme/htdocs/luci-static/openont/cascade.css" \
            "$theme/htdocs/luci-static/openont/script.js" \
            "$theme/ucode/template/themes/openont/header.ut" \
            "$theme/ucode/template/themes/openont/footer.ut" \
            "$theme/ucode/template/themes/openont/sysauth.ut" \
            "$theme/root/etc/uci-defaults/30_luci-theme-openont"
          do
            test -f "$f" || { echo "missing: $f" >&2; exit 1; }
          done

          header="$theme/ucode/template/themes/openont/header.ut"

          # Must not import non-existent luci.version export (breaks WebUI).
          if grep -nE "from 'luci\.version'|nodeinfo" "$header"; then
            echo "header.ut must not import nodeinfo / luci.version" >&2
            exit 1
          fi

          # Theme must not re-init LuCI client (base header.ut does that).
          if grep -nE 'new LuCI\(|/luci\.js' "$header"; then
            echo "header.ut must not load luci.js or construct LuCI" >&2
            exit 1
          fi

          # Prefer ucode control-flow form used by modern LuCI.
          if grep -nE '\{% if [^(]|\{% for [^(]' \
            "$theme/ucode/template/themes/openont/"*.ut; then
            echo "templates should use {% if (…): %} / {% for (…): %}" >&2
            exit 1
          fi

          grep -q 'version\.distversion' "$header" \
            || { echo "header.ut should use version.distversion" >&2; exit 1; }

          grep -q 'mediaurlbase=/luci-static/openont' \
            "$theme/root/etc/uci-defaults/30_luci-theme-openont" \
            || { echo "uci-defaults must force openont mediaurlbase" >&2; exit 1; }

          echo "static checks ok"

  theme:
    name: ${{ matrix.name }}
    needs: [prepare, static]
    runs-on: ubuntu-latest
    # tools + package; first run is long, subsequent benefit from dl cache only
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl ccache ecj fastjar \
            java-propose-classpath libelf-dev python3 python3-dev python3-pyelftools \
            qemu-utils time

      - name: Cache dl/
        uses: actions/cache@v4
        with:
          path: dl
          key: openont-dl-theme-${{ matrix.name }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openont-dl-theme-${{ matrix.name }}-
            openont-dl-${{ matrix.name }}-
            openont-dl-theme-
            openont-dl-

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          chmod +x scripts/openont/apply-config.sh
          ./scripts/openont/apply-config.sh "${{ matrix.target }}"
          grep -E '^CONFIG_PACKAGE_luci-theme-openont=y' .config \
            || { echo "missing CONFIG_PACKAGE_luci-theme-openont=y" >&2; exit 1; }

      # Single-package compile needs host tools (packaging scripts, etc.).
      # Without this, package/*/compile fails almost immediately.
      - name: Host tools
        run: make -j"$(nproc)" tools/install

      # PKGARCH=all still needs target metadata / staging layout on modern trees.
      - name: Toolchain
        run: make -j"$(nproc)" toolchain/install

      - name: Build luci-theme-openont package
        run: |
          set -euo pipefail
          # Package lives under package/openont/ (nested), not package/luci-theme-openont/.
          PKG_DIR="package/openont/luci-theme-openont"
          test -f "$PKG_DIR/Makefile" \
            || { echo "missing $PKG_DIR/Makefile" >&2; exit 1; }

          echo "compiling $PKG_DIR"
          make "$PKG_DIR/compile" V=s -j"$(nproc)"

      - name: Verify package artifact
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t pkgs < <(find bin/packages bin/targets -type f \( \
            -name 'luci-theme-openont*.ipk' -o -name 'luci-theme-openont*.apk' \
          \) 2>/dev/null | sort || true)

          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "no luci-theme-openont .ipk/.apk under bin/packages|bin/targets" >&2
            echo "--- bin tree sample ---"
            find bin -type f 2>/dev/null | head -n 80 || true
            echo "--- logs (if any) ---"
            find logs -type f -name '*.txt' 2>/dev/null | head -n 20 | while read -r f; do
              echo "==== $f ===="
              tail -n 40 "$f" || true
            done
            exit 1
          fi

          for p in "${pkgs[@]}"; do
            echo "found: $p"
            cp -a "$p" out/
          done

          # Prefer inspecting .ipk data; for .apk copy only (still uploadable).
          ipk=$(find out -maxdepth 1 -type f -name 'luci-theme-openont*.ipk' | head -n1 || true)
          if [ -n "$ipk" ]; then
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            tar -xzf "$ipk" -C "$tmp"
            data=$(find "$tmp" -maxdepth 1 -name 'data.tar*' | head -n1)
            [ -n "$data" ] || { echo "ipk has no data.tar*" >&2; exit 1; }
            mkdir -p "$tmp/data"
            case "$data" in
              *.gz) tar -xzf "$data" -C "$tmp/data" ;;
              *.xz) tar -xJf "$data" -C "$tmp/data" ;;
              *.zst) tar --zstd -xf "$data" -C "$tmp/data" ;;
              *) tar -xf "$data" -C "$tmp/data" ;;
            esac
            root="$tmp/data"
            test -f "$root/www/luci-static/openont/cascade.css"
            test -f "$root/usr/share/ucode/luci/template/themes/openont/header.ut"
            if grep -nE "from 'luci\.version'|nodeinfo" \
              "$root/usr/share/ucode/luci/template/themes/openont/header.ut"; then
              echo "packaged header.ut still references nodeinfo" >&2
              exit 1
            fi
            echo "ipk contents ok"
          else
            echo "apk-only artifact; skipped data.tar inspect"
          fi

          ls -lah out

      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-openont-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
